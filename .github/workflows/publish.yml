# Validate every proposed bundle on a pull request; sign and index on merge.
#
# Two jobs on purpose. `validate` runs for contributors and needs no secret,
# so a fork's pull request gets real feedback. `publish` runs only on the
# default branch, where the signing key is available.
#
# The signing step SKIPS with a notice, rather than failing, when the key is
# absent — so this repository stays usable for review even on a fork or a
# clone with no secret configured, and nobody has to disable a red workflow
# while the key is being set up. Once TERMOGRAPH_SIGNING_KEY is configured
# as a repository secret the step signs for real, with no edit here.
#
# tools/sign.py does the actual work (signing, canonical-form checking,
# index.json generation) — see its own module docstring for the full detail,
# including why it independently re-implements the manifest canonicalisation
# rule rather than trusting whatever bytes a contributor's export happened
# to produce.

name: profiles

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: index.json is pipeline-owned
        if: github.event_name == 'pull_request'
        run: |
          # The index is generated. A pull request that edits it is either a
          # mistake or an attempt to list a bundle that was never signed.
          if git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -qx 'index.json'; then
            echo "::error::index.json is written by the publish pipeline — please revert your changes to it."
            exit 1
          fi
          echo "index.json untouched"

      - name: Bundles are well-formed
        run: |
          set -euo pipefail
          shopt -s nullglob
          found=0
          for f in bundles/*.tgprofile; do
            found=$((found + 1))
            echo "checking $f"
            # A bundle is a zip carrying a manifest that commits to every
            # other file by hash. If the manifest is missing there is nothing
            # a signature could meaningfully cover.
            unzip -l "$f" | grep -q 'manifest.json' \
              || { echo "::error::$f has no manifest.json"; exit 1; }
            unzip -p "$f" manifest.json | python3 -c 'import json,sys; json.load(sys.stdin)' \
              || { echo "::error::$f has an unparseable manifest.json"; exit 1; }
          done
          echo "$found bundle(s) checked"

      - name: Index matches its schema
        run: |
          python3 - <<'PY'
          import json
          idx = json.load(open("index.json"))
          assert idx.get("schema_version") == 1, "unexpected schema_version"
          assert isinstance(idx.get("bundles"), list), "bundles must be a list"
          print(f"index.json valid, {len(idx['bundles'])} bundle(s) listed")
          PY

  publish:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for a signing key
        id: key_check
        env:
          TERMOGRAPH_SIGNING_KEY: ${{ secrets.TERMOGRAPH_SIGNING_KEY }}
        run: |
          if [ -z "${TERMOGRAPH_SIGNING_KEY:-}" ]; then
            echo "::notice::TERMOGRAPH_SIGNING_KEY is not configured — skipping signing and indexing."
            echo "::notice::Bundles merged now will need a re-run of this workflow once the key exists."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.key_check.outputs.present == 'true'
        with:
          python-version: "3.12"

      - name: Install signing dependencies
        if: steps.key_check.outputs.present == 'true'
        run: pip install --quiet -r tools/requirements.txt

      - name: Sign bundles and regenerate the index
        if: steps.key_check.outputs.present == 'true'
        env:
          TERMOGRAPH_SIGNING_KEY: ${{ secrets.TERMOGRAPH_SIGNING_KEY }}
        run: python3 tools/sign.py

      - name: Commit signed bundles and the regenerated index
        if: steps.key_check.outputs.present == 'true'
        run: |
          set -euo pipefail
          git config user.name "termograph-profiles-bot"
          git config user.email "actions@users.noreply.github.com"
          git add bundles/ index.json
          if git diff --cached --quiet; then
            echo "nothing changed — bundles were already signed and indexed"
            exit 0
          fi
          git commit -m "Sign bundles and regenerate index"
          git push
